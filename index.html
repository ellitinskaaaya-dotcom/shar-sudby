<style>
:root{--pink:#ff4fd8;--lime:#7dff3a;--bg:#050407;--serif:'Playfair Display',Georgia,serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

body{display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;
 padding-top:max(22px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}
.top{text-align:center;max-width:420px;padding:0 16px;z-index:2;flex:none}
.top h1{font-family:var(--serif);font-weight:900;font-size:36px;line-height:1;text-transform:uppercase;letter-spacing:.04em;
 background:linear-gradient(180deg,#f1eaff 0%,#b79cff 55%,#7a5af0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 18px rgba(150,110,255,.55))}

 -webkit-backdrop-filter:blur(8px) saturate(140%);backdrop-filter:blur(8px) saturate(140%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 8px 24px rgba(0,0,0,.35)}

.idle.hide{opacity:0}

 box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.28),0 10px 34px rgba(160,100,255,.5),0 2px 8px rgba(0,0,0,.4)}

button.go[data-v=iris]::before{opacity:.35}
button.go[data-v=iris]::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;background:conic-gradient(from 0deg,#ff4fd8,#7b5cff,#3df0ff,#7dff3a,#ffe53d,#ff4fd8);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:irhue 6s linear infinite}
@keyframes irhue{to{filter:hue-rotate(360deg)}}
button.go[data-v=chrome]{color:#1a1030;background:linear-gradient(180deg,#ffffff 0%,#e4e8ff 38%,#aab5f0 66%,#f1f2ff 68%,#c2b3ff 100%);
 box-shadow:inset 0 1px 0 #fff,inset 0 -2px 4px rgba(60,40,140,.35),0 0 0 1px rgba(255,255,255,.35),0 12px 34px rgba(125,255,58,.4)}

 box-shadow:inset 0 3px 6px rgba(255,255,255,.8),inset 0 -6px 10px rgba(110,0,80,.45),0 12px 34px rgba(255,79,216,.55)}

 box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 0 0 1px rgba(255,170,240,.5),0 10px 34px rgba(255,79,216,.55),0 2px 8px rgba(0,0,0,.4)}

<script type="module">
import * as THREE from 'three';
import {mergeVertices} from 'three/addons/utils/BufferGeometryUtils.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const ANSWERS=[
 "Да, и не сомневайся","Скорее да","Звёзды за","Без вариантов, да","Конечно","Даже не думай",
 "Скорее нет","Нет, пока нет","Не сейчас","Вселенная против","Спроси позже","Сердце уже знает",
 "Лучше промолчи","Рискни","Всё получится","Пусть решит интуиция","Да, но без спешки",
 "Не торопись","Сегодня твой день","Хватит сомневаться","Easy, boy","Подожди знак","Ответ внутри тебя","Определённо да"
];
const $=id=>document.getElementById(id);
{const v=new URLSearchParams(location.search).get('btn');if(v)$('btn').dataset.v=v}
const stage=$('stage'),cvs=$('gl'),glabel=$('glabel'),ans=$('answer'),idle=$('idle'),btn=$('btn'),hint=$('hint');
const FOV=30, D2R=Math.PI/180;
try{await document.fonts.load('900 80px "Playfair Display"')}catch(e){}

const renderer=new THREE.WebGLRenderer({canvas:cvs,antialias:true,powerPreference:'high-performance'});
const MOB=matchMedia('(pointer:coarse)').matches;
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,MOB?1.5:1.75));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050407);
const camera=new THREE.PerspectiveCamera(FOV,1,.1,60);
const camBase=new THREE.Vector3(0,.1,9);
const composer=new EffectComposer(renderer,new THREE.WebGLRenderTarget(4,4,{type:THREE.HalfFloatType,samples:MOB?2:4}));
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(4,4),.5,.45,1.3);composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- окружение: неоновые «софтбоксы» для отражений ---------- */
function makeEnv(){
  const e=new THREE.Scene();
  e.add(new THREE.Mesh(new THREE.SphereGeometry(10,32,16),new THREE.MeshBasicMaterial({color:0x0b0620,side:THREE.BackSide})));
  const panel=(c,w,h,pos,k)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(k),side:THREE.DoubleSide}));m.position.set(...pos);m.lookAt(0,0,0);e.add(m)};
  panel(0xff4fd8,7,3.5,[-6,2,3],6);panel(0x7dff3a,6,2.2,[6,-2,3],5);panel(0xffffff,9,1.2,[0,7,2],6);
  panel(0x7b5cff,4,6,[5,3,-4],4);panel(0x3df0ff,3,2,[-4,-4,5],3);panel(0xffffff,2,2.5,[3,2,7],4);panel(0xffe0f8,5,1,[-3,-5,-4],3);
  return new THREE.PMREMGenerator(renderer).fromScene(e,.02).texture;
}
scene.environment=makeEnv();
const L1=new THREE.PointLight(0xff4fd8,28,0,2);L1.position.set(-3,2,3);scene.add(L1);
const L2=new THREE.PointLight(0x7dff3a,22,0,2);L2.position.set(3,-2.2,3);scene.add(L2);
const L3=new THREE.DirectionalLight(0xffffff,.9);L3.position.set(0,3,4);scene.add(L3);

/* ---------- вспомогательное ---------- */
const wob=(x,y,z,f)=>Math.sin(x*f+Math.sin(y*f*.7)*1.3)*Math.sin(y*f*1.1+Math.sin(z*f*.9)*1.2)*Math.sin(z*f+x*f*.4);
function heartShape(){const s=new THREE.Shape();s.moveTo(0,-.95);s.bezierCurveTo(-.2,-.75,-1.05,-.2,-1.0,.35);s.bezierCurveTo(-.95,.85,-.3,1.0,0,.55);s.bezierCurveTo(.3,1.0,.95,.85,1.0,.35);s.bezierCurveTo(1.05,-.2,.2,-.75,0,-.95);return s}
function puffyHeart({thick=.34,dome=.28,amp=.02,freq=1}={}){
  const g0=new THREE.ExtrudeGeometry(heartShape(),{depth:.1,bevelEnabled:true,bevelThickness:thick,bevelSize:.2,bevelOffset:-.2,bevelSegments:16,curveSegments:48});
  g0.deleteAttribute('uv');g0.deleteAttribute('normal');
  const g=mergeVertices(g0,1e-4);
  g.computeBoundingBox();g.translate(0,0,-(g.boundingBox.max.z+g.boundingBox.min.z)/2);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);const r=Math.min(1,(x*x+y*y*.8)*.7);p.setZ(i,z+Math.sign(z)*dome*(1-r)*(1-r*.3))}
  g.computeVertexNormals();
  const n=g.attributes.normal;
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);const edge=.35+Math.min(1,(x*x+y*y*.8)*.7);
    const k=(wob(x,y,z,6*freq)*.6+wob(x+3,y+1,z+2,13*freq)*.4)*amp*edge;
    p.setXYZ(i,x+n.getX(i)*k,y+n.getY(i)*k,z+n.getZ(i)*k)}
  g.computeVertexNormals();return g;
}
function glowTex(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const g=x.createRadialGradient(128,128,0,128,128,128);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,256,256);return new THREE.CanvasTexture(c)}
function starTex(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.25,'rgba(255,255,255,.25)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128);
  x.fillStyle='#fff';x.beginPath();x.moveTo(64,2);x.quadraticCurveTo(64,64,126,64);x.quadraticCurveTo(64,64,64,126);x.quadraticCurveTo(64,64,2,64);x.quadraticCurveTo(64,64,64,2);x.fill();
  return new THREE.CanvasTexture(c)}
const STAR=starTex(),GLOW=glowTex();

/* ---------- фон-свечение ---------- */
function glow(color,size,pos,op){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:op}));s.scale.set(size,size,1);s.position.set(...pos);scene.add(s);return s}
glow(0x9b4dff,4.8,[0,.3,-3],.2);glow(0xff4fd8,3.2,[-.8,.5,-2.5],.09);glow(0x7dff3a,2.6,[0,-1.45,-.8],.14);

/* ---------- предметы вокруг ---------- */
const objs=[];
function addObj(m,{pos,rot=[0,0,0],spin=[0,0,0],bob=.06}){m.position.set(...pos);m.rotation.set(...rot);scene.add(m);
  objs.push({m,s0:m.scale.clone(),d:.2+objs.length*.09,rot0:new THREE.Vector3(...rot),e:new THREE.Vector3(),base:new THREE.Vector3(...pos),spin:new THREE.Vector3(...spin),ph:Math.random()*6.28,bob,kick:new THREE.Vector3(),av:new THREE.Vector3()})}

// бархатное сердце
const velvet=new THREE.Mesh(puffyHeart({thick:.38,dome:.3,amp:.014,freq:.9}),new THREE.MeshPhysicalMaterial({color:0x8f76ff,roughness:1,metalness:0,sheen:1,sheenColor:new THREE.Color(0xffc2f6),sheenRoughness:.3,envMapIntensity:.5}));
{const pp=heartShape().getSpacedPoints(160).map(v=>new THREE.Vector3(v.x,v.y,0));
 velvet.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pp,true),300,.03,10,true),new THREE.MeshPhysicalMaterial({color:0xd9ccff,roughness:.9,sheen:1,sheenColor:new THREE.Color(0xffc2f6)})))}
velvet.scale.setScalar(.64);addObj(velvet,{pos:[-1.05,1.3,-.5],rot:[.15,.3,.28],spin:[0,.12,0],bob:.07});

// хромовое сердце-шарик
const chrome=new THREE.Mesh(puffyHeart({thick:.3,dome:.34,amp:.05,freq:1.3}),new THREE.MeshStandardMaterial({color:0xdfe6ff,metalness:1,roughness:.1,envMapIntensity:1.05}));
chrome.scale.setScalar(.44);addObj(chrome,{pos:[1.32,-.7,.5],rot:[-.2,-.45,-.35],spin:[0,.22,0],bob:.08});

// глянцевая трубка
const tubeMat=new THREE.MeshPhysicalMaterial({color:0x7dff3a,roughness:.12,metalness:0,clearcoat:1,clearcoatRoughness:.05,envMapIntensity:1.5,emissive:0x153d00,emissiveIntensity:.6});
const pts=[];for(let i=0;i<=40;i++){const t=i/40;pts.push(new THREE.Vector3((t-.5)*2.3,Math.sin(t*Math.PI*3)*.3,Math.cos(t*Math.PI*2)*.12))}
const tube=new THREE.Group();const curve=new THREE.CatmullRomCurve3(pts);
tube.add(new THREE.Mesh(new THREE.TubeGeometry(curve,220,.12,28,false),tubeMat));
for(const p of [pts[0],pts[40]]){const c=new THREE.Mesh(new THREE.SphereGeometry(.12,28,20),tubeMat);c.position.copy(p);tube.add(c)}
tube.scale.setScalar(.82);addObj(tube,{pos:[1.05,1.5,-.35],rot:[.3,.2,-.35],spin:[.05,0,.04],bob:.07});

// стеклянные бусины
const glassMat=(col)=>new THREE.MeshPhysicalMaterial({color:col,roughness:.05,metalness:0,clearcoat:1,clearcoatRoughness:.02,iridescence:.8,envMapIntensity:2.2,emissive:col,emissiveIntensity:.25});
[[-1.45,.28,.55,.2,0xb890ff],[1.5,.45,.35,.15,0xff7de6],[-.95,-1.0,.9,.16,0x7dff3a],[.45,1.72,.1,.13,0x6ee8ff]].forEach(([x,y,z,r,c])=>{
  addObj(new THREE.Mesh(new THREE.SphereGeometry(r,48,32),glassMat(c)),{pos:[x,y,z],bob:.09})});
// жемчужины
const pearlMat=new THREE.MeshPhysicalMaterial({color:0xeef0ff,metalness:.25,roughness:.14,clearcoat:1,iridescence:1,envMapIntensity:1.4});
[[-1.5,-.62,.2,.1],[-1.28,-.82,.5,.07],[1.35,1.0,.5,.08]].forEach(([x,y,z,r])=>addObj(new THREE.Mesh(new THREE.SphereGeometry(r,32,24),pearlMat),{pos:[x,y,z],bob:.07}));

/* ---------- мех (слои-оболочки) ---------- */
const nc=document.createElement('canvas');nc.width=nc.height=256;{const x=nc.getContext('2d'),id=x.createImageData(256,256);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}x.putImageData(id,0,0)}
const noiseTex=new THREE.CanvasTexture(nc);noiseTex.wrapS=noiseTex.wrapT=THREE.RepeatWrapping;noiseTex.magFilter=THREE.LinearFilter;noiseTex.minFilter=THREE.LinearFilter;noiseTex.generateMipmaps=false;
const uTime={value:0};
const furVert=`uniform float uShell,uLen,uTime;varying vec2 vUv;varying vec3 vN;varying vec3 vV;
void main(){vUv=uv;vec3 n=normalize(normal);vec3 p=position+n*uShell*uLen;
p+=vec3(sin(uTime*1.4+position.y*4.),cos(uTime*1.1+position.x*4.),0.)*.012*uShell*uShell;
vec4 mv=modelViewMatrix*vec4(p,1.);vN=normalize(normalMatrix*n);vV=-mv.xyz;gl_Position=projectionMatrix*mv;}`;
const furFrag=`uniform sampler2D uNoise;uniform float uShell;uniform vec2 uRep;uniform vec3 uRoot,uTip;varying vec2 vUv;varying vec3 vN;varying vec3 vV;
void main(){float n=texture2D(uNoise,vUv*uRep).r;if(uShell>.001&&n<uShell*.96)discard;
vec3 N=normalize(vN),V=normalize(vV);float rim=pow(1.-max(dot(N,V),0.),2.5);
